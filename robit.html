<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StocksalesApp — Loading</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/image/logo.jpg">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #08111f;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .boot-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="boot-spinner" aria-label="Loading"></div>

<script>
    const INVENTORY_URL = 'https://invent.suctech.store/';

    let refreshTimer = null;

    // ---------- Helpers ----------
    function goToInventory() {
        try {
            const randomBytes = new Uint8Array(32);
            crypto.getRandomValues(randomBytes);
            const token = Array.from(randomBytes, byte => byte.toString(16).padStart(2, '0')).join('');
            localStorage.setItem('sessionTokenfordiveris', token);
            window.location.assign(INVENTORY_URL);
        } catch (err) {
            console.error('Unable to prepare inventory session:', err);
            alert('Unable to prepare the inventory session. Please try again.');
        }
    }
    window.goToInventory = goToInventory;
    goToInventory()
</script>
</body>
</html>
