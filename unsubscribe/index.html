<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe · StocksalesApp</title>
     <script src="/envofgethoing.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 440px; text-align: center; }
    h1 { font-size: 1.6rem; margin-bottom: 8px; color: #0f172a; }
    p { color: #64748b; margin-bottom: 24px; }
    input { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; margin-bottom: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #dc2626; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #b91c1c; }
    .status { margin-top: 16px; font-size: 0.9rem; }
    .success { color: #059669; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Unsubscribe</h1>
    <p>We're sorry to see you go. Confirm your email to unsubscribe.</p>
    <form id="unsubForm">
      <input type="email" id="email" placeholder="you@example.com" required />
      <button type="submit">Unsubscribe</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <script>
    // Pre-fill email from query string
    const params = new URLSearchParams(window.location.search);
    const emailParam = params.get('email');
    if (emailParam) {
      document.getElementById('email').value = emailParam;
    }

    const form = document.getElementById('unsubForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      status.textContent = 'Processing...';
      status.className = 'status';

      try {
        const res = await fetch(`${window.ENV?.MYSHOPSUPABASE_URL}/functions/v1/unsubscribe`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${window.ENV?.MYSHOPSUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (data.success) {
          status.textContent = '✅ You have been unsubscribed.';
          status.className = 'status success';
          form.reset();
        } else {
          status.textContent = '❌ ' + (data.error || 'Something went wrong');
          status.className = 'status error';
        }
      } catch (err) {
        status.textContent = '❌ Network error. Please try again.';
        status.className = 'status error';
      }
    });
  </script>
</body>
</html>
